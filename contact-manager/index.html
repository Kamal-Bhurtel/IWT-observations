<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1><span>📇</span> Contact Manager</h1>
            <button class="btn btn-primary" id="btnAdd" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);">
                + Add Contact
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="icon">👥</div>
                <div class="info">
                    <h3 id="totalContacts">0</h3>
                    <p>Total Contacts</p>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search by name, email or phone...">
            </div>
        </div>

        <!-- Contacts Grid -->
        <div class="contacts-grid" id="contactsGrid">
            <!-- Contacts will be rendered here by JavaScript -->
        </div>
    </main>

    <!-- Add / Edit Modal -->
    <div class="modal-overlay" id="contactModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Contact</h2>
                <button class="modal-close" id="btnCloseModal">&times;</button>
            </div>
            <form id="contactForm" onsubmit="return false;">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="name">Full Name <span class="required">*</span></label>
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email <span class="required">*</span></label>
                            <input type="email" id="email" placeholder="john@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone <span class="required">*</span></label>
                            <input type="tel" id="phone" placeholder="+1-555-0100" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" placeholder="123 Main Street, City">
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" placeholder="Any additional notes..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnCancel">Cancel</button>
                    <button type="button" class="btn btn-primary" id="btnSave">Save Contact</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay confirm-dialog" id="confirmModal">
        <div class="modal">
            <div class="modal-body">
                <div class="confirm-icon">🗑️</div>
                <h2 style="margin-bottom: 0.5rem;">Delete Contact?</h2>
                <p>Are you sure you want to delete <strong id="deleteContactName"></strong>?</p>
                <p style="font-size: 0.85rem;">This action cannot be undone.</p>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button type="button" class="btn btn-secondary" id="btnCancelDelete">Cancel</button>
                <button type="button" class="btn btn-danger" id="btnConfirmDelete">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
</body>
</html>
