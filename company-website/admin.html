<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TechNova</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Tech<span>Nova</span></a>
            <ul class="nav-links">
                <li><span class="user-greeting" id="userGreeting">Loading...</span></li>
                <li><button id="logoutBtn" class="btn btn-logout">Logout</button></li>
            </ul>
        </div>
    </nav>

    <main class="dashboard">
        <div class="container">
            <div class="dashboard-header">
                <h1>Admin Dashboard</h1>
                <p class="subtitle">Manage and view all employee details</p>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <span class="stat-number" id="employeeCount">0</span>
                    <span class="stat-label">Employees</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="deptCount">0</span>
                    <span class="stat-label">Departments</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="activeCount">0</span>
                    <span class="stat-label">Active</span>
                </div>
            </div>

            <section class="data-section">
                <div class="section-header">
                    <h2>Employee Directory</h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search by name, email or department...">
                    </div>
                </div>
                <div class="table-wrapper">
                    <table class="data-table" id="employeeTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th>Position</th>
                                <th>Phone</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="profile-section">
                <h2>Your Admin Profile</h2>
                <div class="profile-card" id="adminProfile">
                    <!-- Populated by JS -->
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 TechNova Solutions. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
