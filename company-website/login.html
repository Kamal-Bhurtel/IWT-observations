<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechNova Solutions</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Tech<span>Nova</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="btn-login active">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Sign in to access your portal</p>
            </div>

            <div class="role-tabs">
                <button class="role-tab active" data-role="employee">Employee</button>
                <button class="role-tab" data-role="admin">Admin</button>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@technova.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <div id="loginError" class="error-message" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            </form>

            <div class="demo-credentials">
                <h4>Demo Credentials</h4>
                <div class="cred-box">
                    <strong>Employee:</strong><br>
                    Email: <code>alice@technova.com</code><br>
                    Password: <code>employee123</code>
                </div>
                <div class="cred-box">
                    <strong>Admin:</strong><br>
                    Email: <code>admin@technova.com</code><br>
                    Password: <code>admin123</code>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 TechNova Solutions. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
