<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Book Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #fff;
      padding: 28px 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #f472b6, #60a5fa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    header p {
      color: #c4b5fd;
      font-size: 1.05rem;
      max-width: 480px;
      margin: 0 auto 24px;
      line-height: 1.5;
    }

    .btn-load {
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
      min-width: 180px;
    }

    .btn-load:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(139, 92, 246, 0.5);
    }

    .btn-load:active {
      transform: translateY(0);
    }

    .btn-load:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: none;
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status {
      text-align: center;
      margin: 24px 0 16px;
      font-size: 0.95rem;
      color: #c4b5fd;
      min-height: 28px;
    }

    #books-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 12px;
    }

    .book-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 0.45s forwards;
    }

    .book-card:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(167, 139, 250, 0.4);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .book-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .book-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.4;
      color: #f5f3ff;
      word-break: break-word;
    }

    .book-author {
      color: #a78bfa;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 14px 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 420px;
      margin: 0 auto;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }

      header h1 {
        font-size: 1.85rem;
      }

      header p {
        font-size: 0.95rem;
        margin-bottom: 20px;
      }

      .btn-load {
        width: 100%;
        max-width: 280px;
        padding: 14px 24px;
      }

      #books-list {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .book-card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Book Explorer</h1>
      <p>Discover classic literature from Open Library with a single click</p>
      <button class="btn-load" id="load-books">
        <span class="btn-text">Load Books</span>
        <div class="spinner"></div>
      </button>
    </header>

    <div id="status"></div>
    <div id="books-list"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const btn = document.getElementById("load-books");
      const btnText = btn.querySelector(".btn-text");
      const spinner = btn.querySelector(".spinner");
      const status = document.getElementById("status");
      const list = document.getElementById("books-list");

      btn.addEventListener("click", function () {
        list.innerHTML = "";
        status.textContent = "";

        btn.disabled = true;
        btnText.style.display = "none";
        spinner.style.display = "block";
        status.textContent = "Fetching amazing books...";

        // Open Library API (reliable + CORS friendly)
        const url = "https://openlibrary.org/search.json?q=classic+literature&limit=20";

        fetch(url)
          .then(function (response) {
            if (!response.ok) throw new Error("Network response was not ok");
            return response.json();
          })
          .then(function (data) {
            const books = data.docs || [];

            if (books.length === 0) {
              status.innerHTML = '<div class="error-box">No books found. Please try again.</div>';
              return;
            }

            status.textContent = "Showing " + books.length + " popular classics";

            books.forEach(function (book, index) {
              const title = book.title || "Unknown Title";
              const author = (book.author_name && book.author_name.length > 0)
                ? book.author_name[0]
                : "Unknown Author";

              const delay = index * 0.06;

              const card = document.createElement("div");
              card.className = "book-card";
              card.style.animationDelay = delay + "s";
              card.innerHTML =
                '<div class="book-number">' + (index + 1) + '</div>' +
                '<div class="book-title">' + title + '</div>' +
                '<div class="book-author">by ' + author + '</div>';

              list.appendChild(card);
            });
          })
          .catch(function (err) {
            console.error(err);
            status.innerHTML =
              '<div class="error-box">' +
                'Failed to load books.<br>Please check your internet connection and try again.' +
              '</div>';
          })
          .finally(function () {
            btn.disabled = false;
            spinner.style.display = "none";
            btnText.style.display = "inline";
          });
      });
    });
  </script>

</body>
</html>
